# Manifesto base Distrobox Assemble — Ubuntu 24.04 LTS.
# O install.sh soma ubuntu-development.ini quando o perfil e development.
# Use ./install.sh para escolher o perfil e a inicializacao no login.
# Criacao manual: distrobox assemble create --file ./ubuntu.ini
# Entrada: distrobox enter Ubuntu
#
# Objetivo: ambiente Ubuntu amplo para instalar e usar programas .deb,
# incluindo aplicativos graficos. Nao substitui o kernel nem o desktop
# do hospedeiro, nem equivale a uma instalacao bare-metal.

[Ubuntu]
image=docker.io/library/ubuntu:24.04
pull=true
replace=false
root=false
init=true
start_now=false
entry=true
nvidia=false

# Define o shell do usuario dentro do container e prepara o systemd.
pre_init_hooks="export SHELL=/usr/bin/zsh; test -x /sbin/init || (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv libpam-systemd)"
additional_flags="--label=io.distrobox.ubuntu.terminal=oh-my-zsh"

# Inicializacao e integracao com servicos de sessao.
additional_packages="systemd systemd-sysv libpam-systemd dbus dbus-user-session dbus-x11"

# Gestao de pacotes, chaves e instaladores .deb (CLI e interface grafica).
additional_packages="apt-utils software-properties-common ubuntu-keyring ca-certificates gnupg gpg-agent curl wget gdebi-core gdebi"

# Ferramentas tradicionais de uma distribuicao de uso geral.
additional_packages="locales tzdata sudo passwd bash-completion man-db manpages less nano vim file zip unzip p7zip-full xz-utils tar rsync"
additional_packages="procps psmisc lsof iproute2 iputils-ping dnsutils net-tools"

# Terminal interativo e plugins do Zsh usados pelo instalador.
additional_packages="zsh git zsh-autosuggestions zsh-syntax-highlighting"

# Integracao desktop: tipos de arquivos, aplicativos, preferencias e icones.
additional_packages="xdg-utils xdg-user-dirs desktop-file-utils shared-mime-info libglib2.0-bin gsettings-desktop-schemas dconf-gsettings-backend"
additional_packages="fontconfig fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-color-emoji adwaita-icon-theme hicolor-icon-theme"

# Bibliotecas comuns usadas por apps GTK, Electron, Chromium e outros .deb.
# Nomes de pacotes especificos do Ubuntu 24.04 (transicao t64).
additional_packages="libgtk-3-0t64 libgtk-4-1 libnss3 libnspr4 libgbm1 libxss1 libatk-bridge2.0-0t64 libnotify4 libsecret-1-0 libayatana-appindicator3-1 libxkbcommon0"

# Som, video, aceleracao grafica e compatibilidade com AppImage legado.
additional_packages="libasound2t64 libpulse0 pipewire-audio-client-libraries gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
additional_packages="libgl1 libegl1 libgl1-mesa-dri mesa-vulkan-drivers mesa-utils libvulkan1 libfuse2t64"

# Para GPUs NVIDIA proprietarias, altere nvidia=true se aplicavel ao host.
# Nao use root=true para aplicativos comuns: reduz a separacao do host.
# O HOME padrao e compartilhado com o host. Para isolamento de configuracoes,
# voce pode definir a chave home com um caminho absoluto dedicado.
